# Render Blueprint: the live site.
#
# The database and uploaded photos live on the persistent disk at /data, so they survive
# deploys and restarts. Render takes daily snapshots of the disk.
#
# The first start creates the tables and the starter collections (no sample products). If
# OWNER_EMAIL and OWNER_PASSWORD are set, each start also creates the owner login, or resets
# its password to OWNER_PASSWORD and signs out every session. So once you can sign in, delete
# OWNER_PASSWORD in Render → Environment; change the password in the dashboard from then on.
services:
  - type: web
    name: sok-chenda
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run setup -- --no-samples && { [ -z "$OWNER_EMAIL" ] || [ -z "$OWNER_PASSWORD" ] || npm run owner:create; } && npm start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
      # The site's https:// address (your own domain once added), no trailing slash.
      - key: SITE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      # Only for the first sign-in; delete it afterwards (see above).
      - key: OWNER_PASSWORD
        sync: false
      # Optional Telegram bot for the gold prices (README → Telegram bot).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # 16+ letters, digits, _ or - (Telegram allows nothing else).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Telegram user IDs allowed to change prices, comma-separated. The bot tells you yours.
      - key: TELEGRAM_OWNER_IDS
        sync: false
