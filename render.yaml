# Render Blueprint: a FREE preview of the site, for checking the design.
#
# The free plan has no disk, so the database and photos are rebuilt from scratch on every
# start (after each deploy, and after the service wakes from sleep). Each start creates the
# starter collections, the sample products and, if OWNER_EMAIL is set, the owner login.
# Anything entered in the dashboard is lost at the next restart.
#
# Going live: set `plan: starter`, add
#     disk: { name: data, mountPath: /data, sizeGB: 1 }
# add the variable DATA_DIR=/data, and use `npm run setup -- --no-samples` in startCommand.
services:
  - type: web
    name: sok-chenda
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run setup && { [ -z "$OWNER_EMAIL" ] || npm run owner:create; } && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Optional Telegram bot for the gold prices (README → Telegram bot).
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # 16+ letters, digits, _ or - (Telegram allows nothing else).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Telegram user IDs allowed to change prices, comma-separated. The bot tells you yours.
      - key: TELEGRAM_OWNER_IDS
        sync: false
